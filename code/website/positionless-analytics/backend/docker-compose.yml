version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Mount model and data from project root
      - ../../outputs:/outputs:ro
      - ../../output:/output:ro
      - ../../data:/data:ro
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,https://your-netlify-site.netlify.app
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend